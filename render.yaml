services:
  - type: web
    name: sharepulse-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: ALLOW_ANY_ORIGIN
        value: "false"
      - key: MONGO_URI
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: MAX_FILE_BYTES
        value: 104857600
      - key: OTP_TTL_MINUTES
        value: 10
      - key: CLEANUP_INTERVAL_MS
        value: 30000
      - key: REQUEST_WINDOW_MS
        value: 900000
      - key: REQUEST_MAX
        value: 400
      - key: OTP_ACTION_MAX
        value: 50
      - key: SOCKET_BURST_PER_SEC
        value: 20
      - key: TURN_URL
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
